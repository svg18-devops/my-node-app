###  LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: my-node-app
  namespace: jenkins-deploy
spec:
  type: LoadBalancer
  selector:
    app: my-node-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000


